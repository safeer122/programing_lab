<html>
<head>
<title>change background color</title>
<style>
body{
display:flex;
justify-content:center;
align-items:center;
height:100vh;
flex-direction:column;
}
</style>
</head>
<body>
<h2>change background color</h2>
<button onclick="changeColor()">ClickMe</button>
<script>
let colors=["red","blue","green","yellow","pink"];
let i=0;
function changeColor(){
document.body.style.backgroundColor=colors[i];i++;
if(i==5){
i=0;
}}
</script>
</body>
</html>
